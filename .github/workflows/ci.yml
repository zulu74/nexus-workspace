name: CI

# Three gates for a multi-service stack: do all five images actually
# build, does the stack actually come up and answer health checks
# together (not just "each Dockerfile builds in isolation"), and is
# anything leaking secrets or shipping with known-vulnerable base
# images. This is the same "catch it before it ships" philosophy as
# the secure-cloud-landing-zone project, applied to an app instead of
# infrastructure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-smoke-test:
    name: Build all services + stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up --build -d
        env:
          NEXUS_JWT_SECRET: ci-test-secret

      - name: Wait for all services to report healthy
        run: |
          for port in 8001 8002 8003 8004; do
            echo "waiting on port $port..."
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/healthz" && break
              sleep 2
            done
          done
          curl -sf http://localhost:8000/ > /dev/null && echo "admin console serving OK"

      - name: End-to-end smoke test — signup, login, create second user
        run: |
          SIGNUP=$(curl -sf -X POST http://localhost:8001/auth/signup -H "Content-Type: application/json" -d '{
            "org_name": "CI Test Org", "org_domain": "ci-test.example.com",
            "admin_full_name": "CI Bot", "admin_email": "ci@ci-test.example.com", "admin_password": "CiTestPass123!"
          }')
          TOKEN=$(echo "$SIGNUP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          curl -sf http://localhost:8001/auth/me -H "Authorization: Bearer $TOKEN" > /dev/null
          echo "identity-service: signup + me OK"

          curl -sf http://localhost:8002/channels -H "Authorization: Bearer $TOKEN" > /dev/null
          echo "chat-service: channel auto-create OK"

          curl -sf -X POST http://localhost:8003/documents -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"title":"CI doc","content":"hello"}' > /dev/null
          echo "docs-service: create document OK"

          curl -sf -X POST http://localhost:8004/mail/send -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"to_email":"ci@ci-test.example.com","subject":"test","body":"hi"}' > /dev/null
          echo "mail-service: send OK"

      - name: Tear down
        if: always()
        run: docker compose down -v

  container-scan:
    name: Container image scan (trivy)
    runs-on: ubuntu-latest
    needs: [build-and-smoke-test]
    strategy:
      matrix:
        service: [identity-service, chat-service, docs-service, mail-service, admin-console]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nexus-${{ matrix.service }}:ci ./${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        # Pinned to 0.35.0 specifically: this is the first immutable release
        # after CVE-2026-33634, a supply-chain attack where nearly every
        # prior tag (0.0.1–0.34.2) was force-pushed to a malicious commit.
        # Never pin this action to an older tag or to "latest".
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: nexus-${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
