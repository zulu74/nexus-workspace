<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Docs</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --panel-2:#273449; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --border:#334155; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  #authScreen { max-width: 360px; margin: 100px auto; background: var(--panel); padding: 24px; border-radius: 10px; border:1px solid var(--border); }
  input, textarea { width:100%; padding:9px 10px; margin: 6px 0 12px; background:#0b1220; border:1px solid var(--border); border-radius:6px; color: var(--text); font-family: inherit; }
  textarea { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; resize: vertical; }
  label { font-size:12px; color: var(--muted); }
  button { background: var(--accent); color:#06212f; border:none; padding:9px 14px; border-radius:6px; font-weight:600; cursor:pointer; font-size:13px; }
  button.secondary { background: var(--panel-2); color: var(--text); border:1px solid var(--border); }
  .error { color:#f87171; font-size:13px; margin-top:8px; }
  .hidden { display:none !important; }
  .layout { display:flex; height:100vh; }
  aside { width: 260px; background: var(--panel); border-right:1px solid var(--border); padding: 16px; overflow-y:auto; }
  aside h3 { margin: 0 0 10px; color: var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .doc-item { padding: 8px 10px; cursor:pointer; color: var(--muted); font-size:13px; border-radius:6px; margin-bottom:2px; }
  .doc-item.active { background: var(--panel-2); color: var(--text); }
  .doc-item .meta { font-size:11px; color: #64748b; }
  main { flex:1; display:flex; flex-direction:column; padding: 20px 28px; }
  #titleRow { display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
  #titleRow h2 { margin:0; }
  #editor { flex:1; min-height: 300px; }
  #versionBar { display:flex; gap:8px; align-items:center; margin-top: 10px; font-size:13px; color: var(--muted); }
  #newDocRow { display:flex; gap:8px; margin-bottom: 14px; }
  #newDocRow input { margin:0; flex:1; }
</style>
</head>
<body>

<div id="authScreen">
  <h2 style="margin-top:0">Nexus Docs</h2>
  <label>Email</label><input id="email" type="email">
  <label>Password</label><input id="password" type="password">
  <button onclick="login()">Sign in</button>
  <div id="loginError" class="error"></div>
</div>

<div id="app" class="hidden layout">
  <aside>
    <h3>Documents</h3>
    <div id="newDocRow">
      <input id="newDocTitle" placeholder="New doc title">
      <button onclick="createDoc()">+</button>
    </div>
    <div id="docList"></div>
  </aside>
  <main>
    <div id="titleRow">
      <h2 id="docTitle">Select a document</h2>
      <button onclick="saveVersion()">Save new version</button>
    </div>
    <textarea id="editor" placeholder="Start writing… (Markdown)"></textarea>
    <div id="versionBar"></div>
  </main>
</div>

<script>
const IDENTITY_API = window.NEXUS_IDENTITY_API || "http://localhost:8001";
const DOCS_API = window.NEXUS_DOCS_API || "http://localhost:8003";

let token = localStorage.getItem("nexus_docs_token");
let currentDocId = null;

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    const res = await fetch(IDENTITY_API + "/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(JSON.stringify(data.detail));
    if (data.mfa_required) throw new Error("This account requires MFA — not collected by this demo UI.");
    token = data.access_token;
    localStorage.setItem("nexus_docs_token", token);
    enterApp();
  } catch (e) {
    document.getElementById("loginError").textContent = "Login failed: " + e.message;
  }
}

function authHeaders(extra = {}) {
  return { Authorization: "Bearer " + token, ...extra };
}

async function enterApp() {
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  await loadDocList();
}

async function loadDocList() {
  const res = await fetch(DOCS_API + "/documents", { headers: authHeaders() });
  const docs = await res.json();
  document.getElementById("docList").innerHTML = docs.map(d => `
    <div class="doc-item ${d.id === currentDocId ? 'active' : ''}" onclick="openDoc('${d.id}')">
      ${d.title}
      <div class="meta">${new Date(d.updated_at).toLocaleString()}</div>
    </div>`).join("") || '<div class="meta">No documents yet.</div>';
}

async function createDoc() {
  const title = document.getElementById("newDocTitle").value.trim();
  if (!title) return;
  const res = await fetch(DOCS_API + "/documents", {
    method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ title, content: "" }),
  });
  const doc = await res.json();
  document.getElementById("newDocTitle").value = "";
  await loadDocList();
  openDoc(doc.id);
}

async function openDoc(id) {
  currentDocId = id;
  const res = await fetch(`${DOCS_API}/documents/${id}`, { headers: authHeaders() });
  const doc = await res.json();
  document.getElementById("docTitle").textContent = doc.title;
  document.getElementById("editor").value = doc.content;
  await loadDocList();
  await loadVersions(id);
}

async function saveVersion() {
  if (!currentDocId) return;
  const content = document.getElementById("editor").value;
  await fetch(`${DOCS_API}/documents/${currentDocId}`, {
    method: "PUT", headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ content }),
  });
  await loadDocList();
  await loadVersions(currentDocId);
}

async function loadVersions(id) {
  const res = await fetch(`${DOCS_API}/documents/${id}/versions`, { headers: authHeaders() });
  const versions = await res.json();
  document.getElementById("versionBar").innerHTML =
    "History: " + versions.map(v =>
      `<a href="#" style="color:var(--accent);margin-left:8px" onclick="viewVersion(${v.version_number}); return false;">v${v.version_number}</a> <span style="color:#64748b">(${v.author_email})</span>`
    ).join(" · ");
}

async function viewVersion(versionNumber) {
  const res = await fetch(`${DOCS_API}/documents/${currentDocId}/versions/${versionNumber}`, { headers: authHeaders() });
  const v = await res.json();
  if (confirm(`View v${v.version_number} by ${v.author_email}? (This loads it into the editor — Save to make it current.)`)) {
    document.getElementById("editor").value = v.content;
  }
}

if (token) enterApp().catch(() => { localStorage.removeItem("nexus_docs_token"); });
</script>
</body>
</html>
